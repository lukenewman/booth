# Push a version tag (git tag v0.1.0 && git push --tags) to build Booth and
# publish it as a GitHub Release. Installed copies update themselves from the
# newest release, so its asset names must stay as Electrobun writes them.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Booth.app for Apple Silicon. Electrobun 2 has no Intel Mac build.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Builds the web app; the runtime inside Booth.app comes from Electrobun.
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - name: Install Hutch (Electrobun's build tool)
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - run: desktop/build.sh
        env:
          BOOTH_VERSION: ${{ github.ref_name }}
      - name: Name the installer for people
        run: mv desktop/artifacts/macos-arm64-Booth.dmg "desktop/artifacts/Booth-${GITHUB_REF_NAME}-apple-silicon.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: desktop/artifacts/*

  # Fallback for Intel Macs: the zip with a bundled Bun and a launcher script.
  intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: packaging/build-mac.sh x64
        env:
          BOOTH_VERSION: ${{ github.ref_name }}
      - run: mv dist/Booth-*-mac-x64.zip "dist/Booth-${GITHUB_REF_NAME}-intel.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: intel
          path: dist/Booth-*-intel.zip

  release:
    needs: [app, intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          **Apple Silicon Mac (M1 or newer):** download the `.dmg`, open it, and drag Booth into Applications.
          **Intel Mac:** download the `intel.zip`, unzip it, and read the README inside.

          The first time you open Booth, macOS refuses because it isn't from the App Store. Click **Done**, then go to **System Settings → Privacy & Security**, scroll down, click **Open Anyway** next to the message about Booth, and confirm. You only do this once. Booth keeps itself up to date after that.
          EOF
          gh release create "$GITHUB_REF_NAME" assets/* --title "Booth $GITHUB_REF_NAME" --notes-file notes.md
